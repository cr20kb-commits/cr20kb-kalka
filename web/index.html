<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CR20KB — Калька</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header><strong>CR20KB · КАЛЬКА</strong><button id="import" data-i="import"></button><input id="files" type="file" accept=".pdf,.jpg,.jpeg,.png" multiple hidden><button id="open" data-i="open"></button><input id="project" type="file" accept=".kalka" hidden><button id="save" data-i="save"></button><button id="exportLayer" data-i="exportLayer"></button><button id="exportImage" data-i="exportImage"></button><label><span data-i="language"></span> <select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="zh">简体中文</option></select></label></header>
<main><aside><h2 data-i="layers"></h2><div id="layerList"></div><div class="buttons"><button id="up">↑</button><button id="down">↓</button><button id="remove" data-i="remove"></button></div></aside>
<section class="center"><div class="toolbar"><button id="fit" data-i="fit"></button><button id="zoomOut">−</button><button id="zoomIn">+</button><label><span data-i="mode"></span> <select id="mode"><option value="overlay" data-i="overlay"></option><option value="diff" data-i="diff"></option><option value="blink" data-i="blink"></option></select></label><label><span data-i="base"></span> <select id="base"></select></label><button id="switch" data-i="switch"></button><label><input id="showMarks" type="checkbox"> <span data-i="showMarks"></span></label><span id="regionCount"></span><button id="prevRegion" data-i="previous"></button><button id="nextRegion" data-i="next"></button></div><div id="legend"><span class="a">● A</span> <span class="b">● B</span> <span class="both" data-i="matches"></span></div><div id="warning"></div><div id="viewport"><canvas id="canvas"></canvas></div><div id="status" role="status"></div></section>
<aside id="properties"><h2 data-i="properties"></h2><div id="empty" data-i="selectLayer"></div><div id="fields" hidden>
<label><span data-i="name"></span><input id="name"></label><label><span data-i="source"></span><output id="source"></output></label><label><span data-i="date"></span><input id="date" type="date"><small id="dateSource"></small></label><label><span data-i="role"></span><input id="role" list="roles"><datalist id="roles"></datalist></label><label><span data-i="comment"></span><textarea id="comment" rows="3"></textarea></label>
<label><span data-i="color"></span><input id="color" type="color"></label><label><span data-i="opacity"></span><input id="opacity" type="number" min="0" max="100"></label><label><span data-i="page"></span><input id="page" type="number" min="1" step="1"><small id="pageCount"></small></label><label><span data-i="dpi"></span><input id="dpi" type="number" min="36" max="600" step="1"></label><label><span data-i="threshold"></span><input id="threshold" type="number" min="0" max="255" step="1"></label>
<h3 data-i="alignment"></h3><label>X <input id="x" type="number" step="0.1"></label><label>Y <input id="y" type="number" step="0.1"></label><label><span data-i="angle"></span><input id="angle" type="number" step="0.1"></label><label><span data-i="scale"></span><input id="scale" type="number" min="0.01" max="100" step="0.01"></label><label class="check"><input id="aligned" type="checkbox"><span data-i="aligned"></span></label>
</div></aside></main><script src="/compare_layers.js"></script><script src="/trace_geometry.js"></script><script src="/app.js"></script></body></html>
